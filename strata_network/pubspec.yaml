name: strata_network
description: Dio HTTP client wrapper, token lifecycle management, and cancellation tracking for Strata framework.
version: 2.0.2
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.1 <4.0.0"

dependencies:
  cookie_jar: ^4.0.8
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  equatable: ^3.0.0
  fpdart: ^1.1.0
  get_it: ^9.0.5
  internet_connection_checker_plus: ^3.1.2
  mutex: ^3.1.0
  strata_core:
    path: ../strata_core
  talker: ^4.6.0
  talker_dio_logger: ^4.6.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.24.0
